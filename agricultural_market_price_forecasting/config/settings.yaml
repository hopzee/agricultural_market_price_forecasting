project:
  title: "Development of a Predictive Analytics System for Agricultural Market Price Forecasting"
  geography: "Nigeria"
  source: "WFP Nigeria Food Prices"
  target: "reported market price"
  frequency: "monthly"
  aggregation: "median"
commodities:
  - Maize
  - Rice
  - Garri/cassava products
  - Tomatoes
models:
  - SARIMAX
  - XGBoost
  - LightGBM
benchmarks:
  - Naïve
  - Seasonal naïve
evaluation:
  metrics: [MAE, RMSE, MAPE]
  chronological_split: true
  random_shuffle: false
